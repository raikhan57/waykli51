<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/home.css"/>

   <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <title>Waykli</title>
</head>
<body>
    <nav class="sidebar close">
        <header>
            <div class="image-text">
                <span class="image">
                    <img src="assets/logo_fkip.jpeg" alt="logo">
                </span>

                <div class="text header-text">
                    <span class="name">Waykli</span>
                    <span class="profession">Aplikasi Interaktif</span>
                </div>
            </div>

            <i class="bx bx-chevron-right toggle"></i>
        </header>

        <div class="menu-bar">
            <div class="menu">
                <li class="search-box">
                            <i class='bx bx-search icon'></i>
                            <input type="search" placeholder="Search...">
                </li>
                <ul class="menu-links">
                    <li class="nav-link">
                        <a href="#">
                            <i class='bx bx-home-alt icon'></i>
                            <span class="text nav-text">Home</span>
                        </a>
                    </li>
                    <li class="nav-link">
                        <a href="#">
                            <i class='bx bx-book-open icon'></i>
                            <span class="text nav-text">Perpustakaan</span>
                        </a>
                    </li>
                    <li class="nav-link">
                        <a href="#">
                            <i class='bx bx-clipboard icon'></i>
                            <span class="text nav-text">Ujian</span>
                        </a>
                    </li>
                    <li class="mode">
                    <div class="sun-moon">
                        <i class='bx bx-moon icon moon'></i>
                        <i class='bx bx-sun icon sun'></i>
                    </div>
                    <span class="mode-text text">Dark Mode</span>

                    <div class="toggle-switch">
                        <span class="switch"></span>
                    </div>
                </li>
                </ul>
            </div>
        </div>
    </nav>

    <script src="js/home.js"></script>
    

<div class="button-panel">
        <button class="image-button" onclick="action('Home')">
            <img src="home.png" alt="Home">
            <span>Home</span>
        </button>
        <button class="image-button" onclick="action('Profil')">
            <img src="user.png" alt="Profil">
            <span>Profil</span>
        </button>
        <button class="image-button" onclick="action('Setting')">
            <img src="settings.png" alt="Setting">
            <span>Setting</span>
        </button>
        <button class="image-button" onclick="action('Keluar')">
            <img src="logout.png" alt="Keluar">
            <span>Keluar</span>
        </button>
    </div>

    <script src="js/home.js"></script>
    
</body>
</html>
